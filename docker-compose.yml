services:
  postgres:
    image: postgres:17-alpine
    container_name: renest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage for local dev only (D-5). Production uses a Railway Bucket.
  storage:
    image: rustfs/rustfs:1.0.0
    container_name: renest-storage
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '${STORAGE_PORT:-9000}:9000'
      - '${STORAGE_CONSOLE_PORT:-9001}:9001'
    volumes:
      - storage_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:9000/health']
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the dev bucket, then exits. The e2e global setup creates its own.
  storage-init:
    image: amazon/aws-cli:2.36.45
    container_name: renest-storage-init
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION}
      BUCKET: ${S3_BUCKET}
    entrypoint:
      - sh
      - -c
      - |
        aws --endpoint-url http://storage:9000 s3api head-bucket --bucket "$$BUCKET" 2> /dev/null \
          || aws --endpoint-url http://storage:9000 s3api create-bucket --bucket "$$BUCKET"

volumes:
  postgres_data:
  storage_data:
